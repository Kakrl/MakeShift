name: Vercel preview

# Deploys a Vercel preview when a maintainer adds the `preview-link` label,
# then comments the link on the PR. pull_request_target gives fork PRs access
# to VERCEL_TOKEN, so this job never installs or runs PR code: it only uploads
# the PR source for Vercel to build remotely. The label is removed after each
# run, so new commits need a fresh review and re-label before they build with
# the Preview environment (which holds server-side Supabase secrets).
on:
  pull_request_target:
    branches: [main]
    types: [labeled]

permissions: {}

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy preview
    if: github.event.label.name == 'preview-link'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      VERCEL_ORG_ID: team_H1pNXTHylhx5Sv3GDnyGwp7L
      VERCEL_PROJECT_ID: prj_qrTfPLlIdKRR5eS0q9XhVoCW3sbq
    steps:
      - name: Check out PR source (not executed)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN repository secret is not set"
            exit 1
          fi
          npm install --global vercel@59.11.7
          vercel deploy --cwd pr --yes --format json \
            --meta githubPr="$PR_NUMBER" --meta githubCommitSha="$HEAD_SHA" \
            > deploy.json
          url=$(node -p "require('./deploy.json').deployment.url")
          case "$url" in
            https://*.vercel.app) echo "url=$url" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unexpected deployment URL"; exit 1 ;;
          esac

      - name: Comment preview link
        if: always()
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = "<!-- vercel-preview-link -->";
            const url = process.env.PREVIEW_URL;
            const sha = process.env.HEAD_SHA.slice(0, 7);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = url
              ? [
                  marker,
                  `**Vercel preview** for \`${sha}\`: ${url}`,
                  "",
                  "Re-add the `preview-link` label after reviewing new commits to redeploy.",
                ].join("\n")
              : [
                  marker,
                  `**Vercel preview failed** for \`${sha}\`. See the [workflow run](${run}).`,
                ].join("\n");
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number,
            });
            const existing = comments.find(
              (c) => c.user.type === "Bot" && c.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body,
              });
            }

      - name: Remove preview-link label
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: context.payload.pull_request.number,
                name: "preview-link",
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
