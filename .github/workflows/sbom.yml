name: Generate SBOM

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test SBOM validation
        run: node --test tests/automation/sbom.test.cjs

      - name: Ensure output directory exists
        run: mkdir -p "${{ runner.temp }}/sbom"

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          syft-version: v1.55.0
          output-file: ${{ runner.temp }}/sbom/SBOM.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Validate SBOM and record source revision
        env:
          SBOM_PATH: ${{ runner.temp }}/sbom/SBOM.cdx.json
        run: |
          node tests/automation/validate-sbom.cjs "$SBOM_PATH"
          printf '%s\n' "$GITHUB_SHA" > "${{ runner.temp }}/sbom/commit.txt"

      - name: Upload validated SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: ${{ runner.temp }}/sbom/
          if-no-files-found: error
          retention-days: 30
