name: RCA

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review, closed]

permissions: {}

# Serialize publication and retries for each PR, including partial failures.
concurrency:
  group: rca-${{ github.event.action == 'closed' && 'publish' || 'validate' }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    name: RCA requirements
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { run } = require('./.github/scripts/rca.cjs');
            await run({ github, context, core });

  publish:
    name: Publish RCA
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      # Never check out the PR head or run PR-provided scripts with this token.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { run } = require('./.github/scripts/rca.cjs');
            await run({ github, context, core, publish: true });
